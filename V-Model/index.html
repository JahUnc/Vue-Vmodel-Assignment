<!doctype html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <title>Vue Template</title>
    <script src="https://unpkg.com/vue@3"></script>
</head>

<body>
    <div id="app">
        <h1>Github Assignment</h1>

        <label>Please enter your favorite project:</label>
        <name-input v-model="name"></name-input>

        <p>Your favorite project is: {{name}}</p>
    </div>

    <script>
        Vue.createApp({
            data() {
                return { name: '' };
            },
        })
        .component('name-input', {

            props: ['modelValue'],
            emits: ['update:modelValue'],

            template: `
                <input 
                    type ="text"
                    :value="modelValue"
                    @input="$emit('update:modelValue', $event.target.value)"
                >
            `
        })
        .mount('#app');
    </script>
</body>
</html>
